version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=gpt-5-mini
      - STT_MODEL=gpt-live-transcribe
      - TTS_MODEL=gpt-4o-mini-tts
      - COMPANY_RETENTION_POLICY_REF=XOTO-CORP-RETENTION-POL-2024-V3
      - REGULATORY_SCOPE=UAE / Dubai / DIFC
      - MAX_DBR_RATIO=0.50
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xo_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: xo_network
