version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=gpt-5-mini
      - STT_MODEL=gpt-live-transcribe
      - TTS_MODEL=eleven_flash_v2_5
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-qXpMhyvQqiRxWQs4qSSB}
      - ELEVENLABS_VOICE_NAME=${ELEVENLABS_VOICE_NAME:-Horatius - Energetic Character voice}
      - COMPANY_RETENTION_POLICY_REF=XOTO-CORP-RETENTION-POL-2024-V3
      - REGULATORY_SCOPE=UAE / Dubai / DIFC
      - MAX_DBR_RATIO=0.50
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xo_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: xo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xoto_db
      POSTGRES_USER: xoto_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xoto_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - xo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xoto_user -d xoto_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  xo_postgres_data:

networks:
  default:
    name: xo_network
